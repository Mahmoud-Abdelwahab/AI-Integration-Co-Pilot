<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moyasar AI Co-Pilot</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: #333;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #ff6b6b, #ee5a52);
      color: white;
      padding: 20px;
      text-align: center;
    }
    .header h1 {
      margin: 0;
      font-size: 2.5em;
      font-weight: 300;
    }
    .header p {
      margin: 10px 0 0;
      opacity: 0.9;
      font-size: 1.1em;
    }
    .chat-container {
      padding: 20px;
    }
    #chat {
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      height: 400px;
      overflow-y: auto;
      padding: 15px;
      background: #f8f9fa;
      margin-bottom: 20px;
    }
    .message {
      margin-bottom: 15px;
      padding: 12px 16px;
      border-radius: 8px;
      line-height: 1.5;
    }
    .user-message {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      margin-left: 50px;
    }
    .ai-message {
      background: white;
      border: 1px solid #e0e0e0;
      margin-right: 50px;
    }
    .input-container {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    #question {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 25px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.3s;
    }
    #question:focus {
      border-color: #667eea;
    }
    button {
      padding: 12px 24px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid #ffffff;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 1s ease-in-out infinite;
      margin-left: 10px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .code-block {
      background: #f6f8fa;
      border: 1px solid #e1e4e8;
      border-radius: 6px;
      padding: 16px;
      margin: 16px 0;
      font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
      font-size: 14px;
      overflow-x: auto;
      white-space: pre-wrap;
      line-height: 1.4;
    }
    .copy-btn {
      position: relative;
      float: right;
      background: #e1e4e8;
      border: none;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .copy-btn:hover {
      background: #d1d5db;
    }
    .step {
      background: #e7f3ff;
      border-left: 4px solid #0366d6;
      padding: 12px 16px;
      margin: 12px 0;
      border-radius: 0 6px 6px 0;
    }
    .step strong {
      color: #0366d6;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Moyasar AI Co-Pilot</h1>
      <p>Ask me anything about Moyasar iOS SDK integration</p>
    </div>
    <div class="chat-container">
      <div id="chat"></div>
      <div class="input-container">
        <input type="text" id="question" placeholder="Ask a question about Moyasar SDK...">
        <button onclick="ask()" id="sendBtn">Send</button>
      </div>
    </div>
  </div>

  <script>
    let isLoading = false;

    async function ask() {
      const question = document.getElementById('question').value.trim();
      if (!question || isLoading) return;

      const chat = document.getElementById('chat');
      const sendBtn = document.getElementById('sendBtn');

      // Add user message
      chat.innerHTML += `<div class="message user-message"><strong>You:</strong> ${question}</div>`;
      document.getElementById('question').value = '';

      // Show loading state
      isLoading = true;
      sendBtn.innerHTML = 'Thinking...<div class="loading"></div>';
      sendBtn.disabled = true;

      try {
        const response = await fetch('http://localhost:3000/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question })
        });

        const data = await response.json();
        const formattedAnswer = formatResponse(data.answer);

        chat.innerHTML += `<div class="message ai-message"><strong>AI:</strong> ${formattedAnswer}</div>`;
      } catch (error) {
        chat.innerHTML += `<div class="message ai-message"><strong>AI:</strong> Sorry, I encountered an error. Please try again.</div>`;
        console.error('Error:', error);
      } finally {
        // Hide loading state
        isLoading = false;
        sendBtn.innerHTML = 'Send';
        sendBtn.disabled = false;
        chat.scrollTop = chat.scrollHeight;
      }
    }

    function formatResponse(text) {
      // Basic markdown-like formatting
      text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      text = text.replace(/\*(.*?)\*/g, '<em>$1</em>');

      // Code blocks - clean and simple
      text = text.replace(/```(\w+)?\n?([\s\S]*?)```/g, function(match, lang, code) {
        const cleanCode = code.trim();
        const codeId = 'code_' + Math.random().toString(36).substr(2, 9);
        return `<div class="code-block"><button class="copy-btn" data-code="${btoa(cleanCode)}" onclick="copyToClipboard(this)">Copy</button><pre><code>${cleanCode}</code></pre></div>`;
      });

      // Inline code
      text = text.replace(/`([^`]+)`/g, '<code style="background: #f6f8fa; padding: 2px 4px; border-radius: 3px; font-family: monospace;">$1</code>');

      // Steps
      text = text.replace(/(\d+)\.\s+(.*?)(?=\d+\.|$)/gs, '<div class="step"><strong>Step $1:</strong> $2</div>');

      // Convert line breaks
      text = text.replace(/\n/g, '<br>');

      return text;
    }

    function copyToClipboard(button) {
      const code = atob(button.getAttribute('data-code'));
      navigator.clipboard.writeText(code).then(() => {
        alert('Code copied to clipboard!');
      });
    }

    // Enter key support
    document.getElementById('question').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        ask();
      }
    });
  </script>
</body>
</html>
